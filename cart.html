<style>

    /* =====================================
       SHOPPING CART PAGE
    ===================================== */

    .cart-page {
        min-height: 70vh;
        padding: 80px 0;
    }

    .cart-heading {
        text-align: center;
        margin-bottom: 45px;
    }

    .cart-heading span {
        color: var(--gold);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 4px;
    }

    .cart-heading h1 {
        margin-top: 12px;
        font-family: var(--font-heading);
        font-size: clamp(32px, 5vw, 48px);
    }

    .cart-heading p {
        margin-top: 10px;
        color: var(--grey);
        font-size: 13px;
    }

    .cart-layout {
        display: grid;
        grid-template-columns: 1fr 350px;
        gap: 30px;
        align-items: start;
    }

    .cart-items {
        display: flex;
        flex-direction: column;
        gap: 18px;
    }

    .cart-item {
        display: grid;
        grid-template-columns: 110px 1fr auto;
        gap: 20px;
        align-items: center;

        padding: 18px;

        background: var(--black-card);
        border: 1px solid var(--border);
        border-radius: 7px;
    }

    .cart-item img {
        width: 110px;
        height: 120px;
        object-fit: cover;
        border-radius: 4px;
    }

    .cart-item-info h3 {
        font-family: var(--font-heading);
        font-size: 17px;
    }

    .cart-item-info p {
        margin-top: 6px;
        color: var(--grey);
        font-size: 11px;
    }

    .cart-item-price {
        display: block;
        margin-top: 10px;
        color: var(--gold-light);
        font-size: 16px;
        font-weight: 800;
    }

    .quantity-control {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 13px;
    }

    .quantity-control button {
        width: 30px;
        height: 30px;
        background: transparent;
        color: var(--gold);
        border: 1px solid var(--border);
        border-radius: 3px;
    }

    .quantity-control span {
        min-width: 20px;
        text-align: center;
        font-size: 13px;
    }

    .remove-item {
        align-self: start;
        background: transparent;
        color: #d66b6b;
        border: none;
        font-size: 15px;
        padding: 5px;
    }

    .remove-item:hover {
        color: #ff3333;
    }

    /* ORDER SUMMARY */

    .cart-summary {
        padding: 25px;
        background: var(--black-card);
        border: 1px solid var(--border);
        border-radius: 7px;
    }

    .cart-summary h2 {
        margin-bottom: 25px;
        font-family: var(--font-heading);
        font-size: 23px;
    }

    .summary-row {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        margin-bottom: 17px;
        color: var(--grey);
        font-size: 13px;
    }

    .summary-row strong {
        color: var(--white);
    }

    .summary-total {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        padding-top: 20px;
        margin-top: 20px;
        border-top: 1px solid var(--border);
        font-size: 15px;
        font-weight: 800;
    }

    .summary-total strong {
        color: var(--gold-light);
        font-size: 19px;
    }

    .checkout-btn {
        width: 100%;
        margin-top: 25px;
    }

    .continue-shopping {
        display: block;
        margin-top: 20px;
        color: var(--gold);
        text-align: center;
        font-size: 12px;
    }

    .continue-shopping:hover {
        color: var(--gold-light);
    }

    /* EMPTY CART */

    .empty-cart {
        padding: 60px 20px;
        text-align: center;
        background: var(--black-card);
        border: 1px solid var(--border);
        border-radius: 7px;
    }

    .empty-cart i {
        color: var(--gold);
        font-size: 55px;
        margin-bottom: 20px;
    }

    .empty-cart h2 {
        font-family: var(--font-heading);
        font-size: 25px;
    }

    .empty-cart p {
        margin: 12px 0 25px;
        color: var(--grey);
        font-size: 13px;
    }

    /* RESPONSIVE */

    @media (max-width: 900px) {

        .cart-layout {
            grid-template-columns: 1fr;
        }

        .cart-summary {
            max-width: 100%;
        }

    }

    @media (max-width: 550px) {

        .cart-page {
            padding: 55px 0;
        }

        .cart-item {
            grid-template-columns: 85px 1fr auto;
            gap: 12px;
            padding: 12px;
        }

        .cart-item img {
            width: 85px;
            height: 100px;
        }

        .cart-item-info h3 {
            font-size: 14px;
        }

        .cart-item-price {
            font-size: 14px;
        }

        .quantity-control {
            gap: 8px;
        }

        .quantity-control button {
            width: 27px;
            height: 27px;
        }

        .cart-summary {
            padding: 20px;
        }

    }

</style>

<script>

    document.addEventListener("DOMContentLoaded", () => {

        renderCart();

        document.getElementById("currentYear").textContent =
            new Date().getFullYear();

    });


    // GET CART FROM LOCAL STORAGE

    function getShoppingCart() {

        return JSON.parse(
            localStorage.getItem("kasBoutiqueCart")
        ) || [];

    }


    // FORMAT ZAMBIAN KWACHA

    function cartPrice(price) {

        return "K" + Number(price).toLocaleString("en-ZM");

    }


    // DISPLAY CART ITEMS

    function renderCart() {

        const cartContent =
            document.getElementById("cartContent");

        const cart = getShoppingCart();

        const cartCount =
            document.getElementById("cartCount");

        const totalQuantity = cart.reduce(
            (total, item) => total + item.quantity,
            0
        );

        cartCount.textContent = totalQuantity;


        // EMPTY CART

        if (cart.length === 0) {

            cartContent.innerHTML = `
                <div class="empty-cart">
                    <i class="fas fa-shopping-bag"></i>
                    <h2>Your cart is empty</h2>
                    <p>Discover something special in our collection.</p>
                    <a href="index.html" class="btn">Continue Shopping</a>
                </div>
            `;
            return;

        }

        const subtotal = cart.reduce(
            (total, item) => total + Number(item.price || 0) * Number(item.quantity || 0),
            0
        );

        const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);

        cartContent.innerHTML = `
            <div class="cart-layout">
                <div class="cart-items">
                    ${cart.map((item, index) => `
                        <article class="cart-item">
                            <img src="${escapeHTML(item.image || "")}" alt="${escapeHTML(item.name || "Product")}">
                            <div class="cart-item-info">
                                <h3>${escapeHTML(item.name || "Product")}</h3>
                                <span class="cart-item-price">${cartPrice(item.price)}</span>
                                <div class="quantity-control">
                                    <button type="button" data-action="decrease" data-index="${index}" aria-label="Decrease quantity">−</button>
                                    <span>${Number(item.quantity) || 0}</span>
                                    <button type="button" data-action="increase" data-index="${index}" aria-label="Increase quantity">+</button>
                                </div>
                            </div>
                            <button type="button" class="remove-item" data-action="remove" data-index="${index}" aria-label="Remove ${escapeHTML(item.name || "product")}">
                                <i class="fas fa-trash"></i>
                            </button>
                        </article>
                    `).join("")}
                </div>

                <aside class="cart-summary">
                    <h2>Order Summary</h2>
                    <div class="summary-row"><span>Subtotal</span><strong>${cartPrice(subtotal)}</strong></div>
                    <div class="summary-row"><span>Delivery</span><strong>Calculated at checkout</strong></div>
                    <div class="summary-total"><span>Total</span><strong>${cartPrice(subtotal)}</strong></div>
                    <a href="checkout.html" class="btn checkout-btn">Proceed to Checkout</a>
                    <a href="index.html" class="continue-shopping">Continue Shopping</a>
                </aside>
            </div>
        `;

        cartContent.querySelectorAll("[data-action]").forEach(button => {
            button.addEventListener("click", () => {
                const index = Number(button.dataset.index);
                const action = button.dataset.action;
                const updatedCart = getShoppingCart();

                if (!updatedCart[index]) return;

                if (action === "remove") {
                    updatedCart.splice(index, 1);
                } else if (action === "increase") {
                    updatedCart[index].quantity = (Number(updatedCart[index].quantity) || 0) + 1;
                } else if (action === "decrease") {
                    updatedCart[index].quantity = (Number(updatedCart[index].quantity) || 0) - 1;
                    if (updatedCart[index].quantity <= 0) updatedCart.splice(index, 1);
                }

                localStorage.setItem("kasBoutiqueCart", JSON.stringify(updatedCart));
                renderCart();
            });
        });

    }

    renderCart();
